name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-service:
    name: model-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: model-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  fraud-service:
    name: fraud-service (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: fraud-service/pom.xml
      - run: ./mvnw -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: surefire-reports
          path: fraud-service/target/surefire-reports/

  integration:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [model-service, fraud-service]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test (Java -> Python -> MySQL)
        run: scripts/smoke.sh http://localhost:8080 demo demo123
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
