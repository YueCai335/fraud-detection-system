name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-service:
    name: model-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: model-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  fraud-service:
    name: fraud-service (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: fraud-service/pom.xml
      - run: ./mvnw -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: fraud-service/target/surefire-reports/

  integration:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [model-service, fraud-service]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Health
        run: |
          curl -fsS http://localhost:8080/actuator/health | tee health.json
          grep -q '"modelService":{"status":"UP"' health.json
      - name: Score a transaction through the REST API
        run: |
          curl -fsS -u demo:demo123 -H 'Content-Type: application/json' \
            http://localhost:8080/api/v1/predictions \
            -d '{"step":100,"typeCode":1,"amount":10000,"oldbalanceOrg":10000,"newbalanceOrig":0,"oldbalanceDest":0,"newbalanceDest":10000}' \
            | tee single.json
          grep -q '"fraud":true' single.json
      - name: Batch CSV through the REST API
        run: |
          curl -fsS -u demo:demo123 \
            -F file=@fraud-service/src/main/resources/static/samples/sample_transactions.csv \
            http://localhost:8080/api/v1/predictions/batch | tee batch.json
          grep -q '"total":8' batch.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
