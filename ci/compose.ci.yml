# Compose overrides for the Jenkins smoke-test stage (merged on top of docker-compose.yml).
#
# Two things differ from a GitHub Actions run, and both come from where Jenkins lives.
#
# 1. Ports. The runner is a fresh VM; this Jenkins runs on a laptop that usually already has
#    `docker compose up` going, and COMPOSE_PROJECT_NAME only isolates container names and
#    volumes — published host ports still collide ("Bind for 0.0.0.0:3306 failed"). So the CI
#    stack publishes nothing it does not need, and uses its own ports for what it does.
#    `!reset` / `!override` are needed because compose merges port lists instead of replacing them.
#
# 2. Hosts. On a runner the app is at localhost. The Jenkins controller is itself a container,
#    so the app is on the Docker host: $CI_HOST (set in the Jenkinsfile). That address also has to
#    go into the pre-signed download URL, because the client following it is curl inside Jenkins.
services:
  mysql:
    ports: !reset []           # only fraud-service talks to it, over the compose network
  model-service:
    ports: !reset []           # same
  localstack:
    ports: !override
      - "14566:4566"
  fraud-service:
    ports: !override
      - "18080:8080"
    environment:
      STORAGE_PUBLIC_ENDPOINT: http://${CI_HOST}:14566
