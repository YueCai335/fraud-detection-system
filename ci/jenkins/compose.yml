# Local Jenkins for this repo:   docker compose -f ci/jenkins/compose.yml up -d --build
# UI on http://localhost:8081 (8080 is taken by fraud-service when the app stack is up).
services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # lets Jenkins drive the host's Docker
    group_add:
      - "0"   # the mounted socket is owned by root:root; group 0 grants the jenkins user access
    restart: unless-stopped

volumes:
  jenkins_home:
