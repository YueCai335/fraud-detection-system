# One command brings up the whole system:
#   docker compose up --build
# then open http://localhost:8080 (demo / demo123) or http://localhost:8080/swagger-ui.html

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fraud
      MYSQL_USER: fraud
      MYSQL_PASSWORD: fraud
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufraud", "-pfraud"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object store for batch job files (S3 itself in AWS).
  # LocalStack, not MinIO: MinIO stopped publishing public images (quay.io now needs
  # credentials, docker.io/minio/minio is gone), which broke `docker compose up` and the
  # CI smoke test on any machine without a cached copy.
  # Object data is not persisted across restarts here; the bucket is recreated on startup
  # by STORAGE_CREATE_BUCKET, and the batch_jobs rows in MySQL do survive.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"   # one endpoint for every AWS service it emulates (also the presigned-URL host)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  model-service:
    build: ./model-service
    environment:
      FRAUD_THRESHOLD: "0.25"
    ports:
      - "5001:5000"   # host port 5001: macOS AirPlay Receiver often occupies 5000
    # healthcheck is declared in model-service/Dockerfile

  fraud-service:
    build: ./fraud-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fraud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: fraud
      DB_PASSWORD: fraud
      MODEL_SERVICE_URL: http://model-service:5000
      SPRING_PROFILES_ACTIVE: demo   # seeds demo/demo123 + sample history; omit in real environments
      STORAGE_TYPE: s3
      STORAGE_BUCKET: fraud-batch
      STORAGE_ENDPOINT: http://localstack:4566
      STORAGE_PUBLIC_ENDPOINT: http://localhost:4566   # presigned URLs must be reachable from the browser
      STORAGE_ACCESS_KEY: test        # LocalStack accepts any credentials; 'test' is its convention
      STORAGE_SECRET_KEY: test
      STORAGE_CREATE_BUCKET: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

volumes:
  mysql-data:
