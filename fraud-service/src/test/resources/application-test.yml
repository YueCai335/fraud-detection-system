# "test" profile (see @ActiveProfiles): in-memory H2 in MySQL compatibility mode so the Flyway migrations run unchanged.
spring:
  datasource:
    url: jdbc:h2:mem:fraud;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

model-service:
  base-url: http://model-service.test
  connect-timeout: 1s
  read-timeout: 1s
  batch-chunk-size: 2
