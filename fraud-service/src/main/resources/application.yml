spring:
  application:
    name: fraud-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fraud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway; Hibernate only checks it matches
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

model-service:
  base-url: ${MODEL_SERVICE_URL:http://localhost:5000}
  connect-timeout: 2s
  read-timeout: 30s
  batch-chunk-size: 500

# Retry + circuit breaker around every model call (instance name "model").
resilience4j:
  retry:
    instances:
      model:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.yuecai.fraud.modelclient.ModelServiceUnavailableException
  circuitbreaker:
    instances:
      model:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.yuecai.fraud.modelclient.ModelServiceUnavailableException
        ignore-exceptions:
          - com.yuecai.fraud.modelclient.ModelServiceException

# Batch jobs: files in the object store, processing by the in-process worker.
storage:
  type: ${STORAGE_TYPE:memory}          # memory | s3
  bucket: ${STORAGE_BUCKET:}
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:us-east-1}}
  endpoint: ${STORAGE_ENDPOINT:}         # MinIO only
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  create-bucket: ${STORAGE_CREATE_BUCKET:false}

batch:
  worker:
    enabled: ${BATCH_WORKER_ENABLED:true}
    poll-interval: 5s
    stale-after: 5m          # RUNNING with no heartbeat for this long -> reclaimed
    chunk-size: 500
    max-rows: 100000
  result-url-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  port: ${SERVER_PORT:8080}
  # Behind a TLS-terminating load balancer (ALB) the container sees plain HTTP; honour
  # X-Forwarded-Proto/Host so redirects and secure cookies use the client-facing https URL.
  forward-headers-strategy: native
  # Let in-flight requests (e.g. a batch upload) finish when ECS sends SIGTERM during a deploy.
  shutdown: graceful
  servlet:
    jsp:
      init-parameters:
        development: "false"
        mappedfile: "false"   # compact generated code; the legacy pages otherwise exceed the 64KB method limit
  error:
    include-message: always
